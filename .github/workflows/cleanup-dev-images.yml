name: Cleanup Dev Images

on:
  workflow_run:
    workflows:
      - Build Docker Images
    types:
      - completed
  push:
    tags:
      - '[0-9]*.[0-9]*'
  workflow_dispatch:

concurrency:
  group: ghcr-cleanup-uscf
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup GHCR dev image history
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'dev'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE_NAME: uscf
      KEEP_COUNT: '10'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up old dev package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./.github/scripts/cleanup-dev-images.sh
