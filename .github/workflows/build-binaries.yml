name: Build Binaries
on:
  push:
    tags:
      - '[0-9]*.[0-9]*'

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            asset_name: uscf-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset_name: uscf-windows-arm64.exe
          - goos: linux
            goarch: amd64
            asset_name: uscf-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: uscf-linux-arm64
          - goos: darwin
            goarch: amd64
            asset_name: uscf-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: uscf-darwin-arm64

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compute build metadata
        id: vars
        shell: bash
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          ldflags="-s -w -X github.com/HynoR/uscf/cmd.version=${{ steps.vars.outputs.version }} -X github.com/HynoR/uscf/cmd.commit=${{ steps.vars.outputs.commit }} -X github.com/HynoR/uscf/cmd.date=${{ steps.vars.outputs.date }}"
          go build -trimpath -ldflags="$ldflags" -o "${{ matrix.asset_name }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 5

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract tag name
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: uscf-*
          merge-multiple: true

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ steps.tag.outputs.VERSION }}" >/dev/null 2>&1; then
            gh release create "${{ steps.tag.outputs.VERSION }}" \
              --title "Release ${{ steps.tag.outputs.VERSION }}" \
              --generate-notes
          fi

          gh release upload "${{ steps.tag.outputs.VERSION }}" ./artifacts/* --clobber
